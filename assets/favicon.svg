<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C1E3A" />
      <stop offset="100%" stop-color="#070808" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  
  <!-- Subtle Outer Accent Ring -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#blueGlow)" stroke-width="1.5" />

  <!-- Inner Gold Border -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.4" />

  <!-- Alpha Monogram (α) with Glow -->
  <g filter="url(#glow)">
    <path d="M44 26 C41 23, 36 21, 31 21 C22 21, 16 27, 16 34 C16 41, 21 46, 29 46 C35 46, 40 43, 44 38 M44 21 L44 45" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="4.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>
